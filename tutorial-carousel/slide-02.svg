<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"><rect x="0" y="0" width="1080" height="1350" fill="#F6F2E9" rx="0" stroke="none"/><text x="72" y="95" fill="#184B3D" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" letter-spacing="2">CHATGPT + PYTHON</text><path d="M72 1225H1008" stroke="#CFCFC3" stroke-width="2"/><text x="72" y="1279" fill="#59615D" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="600" >TOM VU / PRACTICAL WORKFLOWS</text><text x="1008" y="1279" fill="#59615D" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="600" text-anchor="end">02 / 04</text><rect x="72" y="152" width="120" height="54" fill="#DE5838" rx="6" stroke="none"/><text x="132" y="188" fill="#F6F2E9" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="middle">STEP 1</text><text x="72" y="293" fill="#202323" font-family="Arial, Helvetica, sans-serif" font-size="70" font-weight="600" >Start with clear rules.</text>
     <text x="72" y="354" fill="#59615D" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="400" >Use a small synthetic file to define the workflow.</text>
     <rect x="72" y="420" width="936" height="410" fill="#FFFFFF" rx="18" stroke="#CFCFC3"/>
     <text x="112" y="477" fill="#184B3D" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" letter-spacing="2">PROMPT TO USE</text>
     <text x="112" y="551" fill="#202323" font-family="Arial, Helvetica, sans-serif" font-size="33" font-weight="500" >Write a Python standard-library CSV validator.</text>
     <text x="112" y="612" fill="#202323" font-family="Arial, Helvetica, sans-serif" font-size="33" font-weight="500" >Require ID, ISO date, category and amount.</text>
     <text x="112" y="673" fill="#202323" font-family="Arial, Helvetica, sans-serif" font-size="33" font-weight="500" >Flag invalid rows; keep each valid ID once.</text>
     <text x="112" y="734" fill="#202323" font-family="Arial, Helvetica, sans-serif" font-size="33" font-weight="500" >Write cleaned.csv and a JSON summary.</text>
     <text x="112" y="795" fill="#202323" font-family="Arial, Helvetica, sans-serif" font-size="33" font-weight="500" >Use Decimal for amounts. Add focused tests.</text>
     <text x="72" y="934" fill="#202323" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="700" >Define the checks before the code.</text>
     <text x="72" y="1002" fill="#59615D" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="400" >The linked example uses four explicit columns:</text>
     <rect x="72" y="1040" width="936" height="95" fill="#184B3D" rx="12" stroke="none"/>
     <text x="107" y="1097" fill="#F6F2E9" font-family="Consolas, 'Courier New', monospace" font-size="26">transaction_id · date · category · amount</text></svg>