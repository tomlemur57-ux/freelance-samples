<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1350" viewBox="0 0 1080 1350"><rect x="0" y="0" width="1080" height="1350" fill="#F6F2E9" rx="0" stroke="none"/><text x="72" y="95" fill="#184B3D" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" letter-spacing="2">CHATGPT + PYTHON</text><path d="M72 1225H1008" stroke="#CFCFC3" stroke-width="2"/><text x="72" y="1279" fill="#59615D" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="600" >TOM VU / PRACTICAL WORKFLOWS</text><text x="1008" y="1279" fill="#59615D" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="600" text-anchor="end">03 / 04</text><rect x="72" y="152" width="120" height="54" fill="#DE5838" rx="6" stroke="none"/><text x="132" y="188" fill="#F6F2E9" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="middle">STEP 2</text><text x="72" y="293" fill="#202323" font-family="Arial, Helvetica, sans-serif" font-size="70" font-weight="600" >Run it. Then test it.</text>
     <text x="72" y="354" fill="#59615D" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="400" >From the linked repository’s csv-report folder:</text>
     <rect x="72" y="421" width="936" height="407" fill="#184B3D" rx="18" stroke="none"/>
     <text x="112" y="482" fill="#D9F06B" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="700" letter-spacing="2">LOCAL TERMINAL</text>
     <text x="112" y="574" fill="#F6F2E9" font-family="Consolas, 'Courier New', monospace" font-size="26">python csv_report.py sample_transactions.csv out</text>
     <text x="112" y="683" fill="#F6F2E9" font-family="Consolas, 'Courier New', monospace" font-size="27">python -m unittest -v</text>
     <text x="112" y="765" fill="#D9F06B" font-family="Consolas, 'Courier New', monospace" font-size="27">Ran 3 tests — OK</text>
     <text x="72" y="935" fill="#202323" font-family="Arial, Helvetica, sans-serif" font-size="41" font-weight="700" >Review the exceptions.</text>
