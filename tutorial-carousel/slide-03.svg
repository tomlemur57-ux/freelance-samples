     <text x="72" y="1064" fill="#202323" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="500" >Line 6 → missing category</text>
     <text x="72" y="1135" fill="#59615D" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="400" >Keep the source export; inspect every rejected row.</text></svg>